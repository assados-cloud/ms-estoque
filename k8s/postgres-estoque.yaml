apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-estoque
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-estoque
spec:
  selector:
    app: postgres-estoque
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-estoque
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-estoque
  template:
    metadata:
      labels:
        app: postgres-estoque
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: estoquedb
            - name: POSTGRES_USER
              value: estoque
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-estoque
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "estoque", "-d", "estoquedb"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: postgres-estoque
